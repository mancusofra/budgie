# Builds an UNSIGNED iOS .ipa (to be signed and installed with a free Apple ID
# through a sideloading tool). No Mac or Apple Developer account needed.
#
# To run it: push an "ios-build-*" tag on the commit to build, e.g.
#   git tag ios-build-1 && git push origin ios-build-1
# (or "Run workflow" from the Actions page).
# The .ipa can be downloaded from the run artifacts.
name: iOS IPA (unsigned)

on:
  push:
    tags: ['ios-build-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate the native iOS project (ios/ is not in the repository)
      - run: npx expo prebuild --platform ios --clean

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Budgie.xcworkspace \
            -scheme Budgie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Budgie.app Payload/
          zip -qry Budgie-unsigned.ipa Payload
          ls -lh Budgie-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Budgie-unsigned-ipa
          path: Budgie-unsigned.ipa
          retention-days: 14
