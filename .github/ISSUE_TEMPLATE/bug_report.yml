name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Budgie version
      description: At the bottom of Settings (e.g. 0.2.0 (2)).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. iPhone 15, iOS 26.1 · Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Don't attach backups or exports containing personal data.
